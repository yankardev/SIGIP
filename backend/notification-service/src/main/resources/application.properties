spring.application.name=notification-service
server.port=8099
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sigip_notification?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
sigip.jwt.secret=${JWT_SECRET}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.auto-startup=false
sigip.rabbit.queue=${SIGIP_RABBIT_QUEUE:sigip.notifications}