spring.application.name=inventory-service
server.port=${PORT:8098}

# --- Base de datos ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sigip_inventory?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}

# --- Seguridad ---
sigip.jwt.secret=${JWT_SECRET}

# --- Descubrimiento y monitoreo ---
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${random.value}
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
