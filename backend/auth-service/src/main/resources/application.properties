spring.application.name=auth-service
server.port=8093

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sigip_auth?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

sigip.jwt.secret=${JWT_SECRET}
sigip.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:30}
