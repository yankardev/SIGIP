global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: sigip-sales
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["sales-service:8095"]

  - job_name: sigip-catalog
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["catalog-service:8094"]
