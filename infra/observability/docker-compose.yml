services:
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: sigip-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      - sigip

  grafana:
    image: grafana/grafana:12.1.1
    container_name: sigip-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Define GRAFANA_ADMIN_PASSWORD en el entorno}
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - sigip
    depends_on:
      - prometheus

networks:
  sigip:
    external: true
    name: sigip_default

volumes:
  prometheus-data:
  grafana-data:
