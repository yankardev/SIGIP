apiVersion: v1
kind: ConfigMap
metadata:
  name: sigip-sales-config
data:
  EUREKA_URL: "http://discovery-server:8761/eureka/"
  DB_URL: "jdbc:mysql://mysql:3306/sigip_sales?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima"
  DB_USER: "root"
  RABBITMQ_HOST: "rabbitmq"
  RABBITMQ_PORT: "5672"
  EVENTOS_HABILITADOS: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sales-service
  labels:
    app: sales-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sales-service
  template:
    metadata:
      labels:
        app: sales-service
    spec:
      containers:
        - name: sales-service
          image: sigip/sales-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8095
          envFrom:
            - configMapRef:
                name: sigip-sales-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sigip-secrets
                  key: MYSQL_ROOT_PASSWORD
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: sigip-secrets
                  key: RABBITMQ_USER
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sigip-secrets
                  key: RABBITMQ_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: sigip-secrets
                  key: JWT_SECRET
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 750m
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: sales-service
spec:
  selector:
    app: sales-service
  ports:
    - name: http
      port: 8095
      targetPort: http
  type: ClusterIP
